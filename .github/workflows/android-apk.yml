# Build APK Android installable (preview interne, sans EAS).
# Artifact : Actions → run → Artifacts → dotohub-mobile-android → dotohub-preview.apk
# Signing : assembleRelease + keystore debug (installable hors Play Store).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "app.json"
      - "App.tsx"
      - "package.json"
      - "package-lock.json"
      - "index.ts"
      - "babel.config.*"
      - ".github/workflows/android-apk.yml"

env:
  # Aligné sur eas.json preview/production
  EXPO_PUBLIC_API_URL: https://doto-anato.loca.lt
  CI: "true"
  EXPO_NO_TELEMETRY: "1"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean

      - name: Preview signing (release APK, keystore debug)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          t = p.read_text()
          t = t.replace("signingConfig signingConfigs.release", "signingConfig signingConfigs.debug")
          p.write_text(t)
          print("patched signingConfig -> debug" if "signingConfigs.debug" in t else "WARN: debug signing not found")
          PY

      - name: Gradle assembleRelease
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Package and verify APK
        run: |
          set -euo pipefail
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          OUT="dotohub-preview.apk"

          if [ ! -f "${SRC}" ]; then
            echo "APK release introuvable: ${SRC}"
            find android/app/build/outputs -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          cp "${SRC}" "${OUT}"
          SIZE=$(stat -c%s "${OUT}")
          echo "APK: ${OUT} (${SIZE} bytes)"

          if [ "${SIZE}" -lt 1048576 ]; then
            echo "::error::APK trop petit (< 1 Mo) — build probablement incomplet."
            exit 1
          fi

          unzip -l "${OUT}" | head -n 40
          unzip -l "${OUT}" | grep -q "AndroidManifest.xml"
          unzip -l "${OUT}" | grep -Eq "classes(\.dex|[0-9]+\.dex)"

          APKSIGNER=$(ls -1 "${ANDROID_HOME}/build-tools/"*/apksigner | sort -V | tail -n 1)
          echo "apksigner: ${APKSIGNER}"
          "${APKSIGNER}" verify --verbose "${OUT}"
          echo "APK preview signé OK."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotohub-mobile-android
          path: dotohub-preview.apk
          if-no-files-found: error
          retention-days: 14
