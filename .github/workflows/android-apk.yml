# Build APK Android sans EAS (preview interne).
# Artifact : Actions → run → Artifacts → dotohub-mobile-android
# Signing : assembleRelease avec le keystore debug Android (défaut Expo/RN).
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "app.json"
      - "package.json"
      - "package-lock.json"
      - "index.ts"
      - "babel.config.*"
      - ".github/workflows/android-apk.yml"

env:
  # Aligné sur eas.json preview/production
  EXPO_PUBLIC_API_URL: https://doto-anato.loca.lt
  CI: "true"
  EXPO_NO_TELEMETRY: "1"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node24-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --clean

      - name: Verify release signing (debug keystore)
        # Le template Expo/RN signe release avec signingConfigs.debug par défaut.
        # Preview interne uniquement — pas pour le Play Store.
        run: |
          set -euo pipefail
          grep -n "signingConfig" android/app/build.gradle || true
          if ! grep -q "signingConfigs.debug" android/app/build.gradle; then
            echo "::warning::signingConfigs.debug introuvable — le build release peut échouer."
          fi

      - name: Gradle assembleRelease
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Package APK as app-release.apk
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -z "${APK}" ]; then
            echo "Aucun APK trouvé sous android/app/build/outputs/apk"
            find android/app/build/outputs -type f || true
            exit 1
          fi
          echo "APK source: ${APK} ($(du -h "${APK}" | cut -f1))"
          cp "${APK}" app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotohub-mobile-android
          path: app-release.apk
          if-no-files-found: error
          retention-days: 14
